name: API Tests (pytest + httpx)

on:
  pull_request:
    paths:
      - 'automation/api/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/api/**'
  workflow_dispatch:
    inputs:
      api_env:
        description: 'Environment to test against'
        required: false
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automation/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run smoke tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_ENV: ${{ inputs.api_env || 'staging' }}
        run: uv run pytest -m smoke --tb=short

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-allure-results
          path: automation/api/allure-results/
          retention-days: 14
