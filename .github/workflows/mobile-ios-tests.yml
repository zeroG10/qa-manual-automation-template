name: Mobile Tests — iOS (Appium)

on:
  pull_request:
    paths:
      - 'automation/mobile/**'
      - '.github/workflows/mobile-ios-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/mobile/**'
  workflow_dispatch:

jobs:
  ios:
    # macOS runner required for iOS Simulator + Xcode
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation/mobile
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Set up Node (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Download .app
        # TODO: replace with your real .app source (build job, TestFlight, Firebase, etc.)
        run: |
          mkdir -p builds
          echo "Place App.app (simulator build) in automation/mobile/builds/ via build job or external source"
          # Example: aws s3 cp s3://artifacts/${{ github.sha }}/App.app builds/App.app --recursive
          exit 1  # Remove this when .app source is configured

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl create "ci-iPhone" "iPhone 15" "iOS17.4" 2>/dev/null || xcrun simctl list devices "iPhone 15" | grep -E "iPhone 15 \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE_ID" || true
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 --log-level warn > appium.log 2>&1 &
          sleep 5

      - name: Run iOS tests
        run: |
          cp .env.example .env
          uv run pytest --platform=ios -m smoke --tb=short

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-allure-results
          path: automation/mobile/allure-results/
          retention-days: 14

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-appium-log
          path: automation/mobile/appium.log
          retention-days: 7
