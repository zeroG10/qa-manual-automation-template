name: Web Tests (Playwright)

on:
  pull_request:
    paths:
      - 'automation/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --config=automation/web/playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: automation/web/playwright/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: automation/web/playwright/test-results/
          retention-days: 7
