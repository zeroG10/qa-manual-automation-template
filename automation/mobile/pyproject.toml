[project]
name = "mobile-automation"
version = "0.1.0"
description = "Appium + Python mobile automation (Android, iOS, Flutter)"
requires-python = ">=3.11"
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.20.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.0",
    "allure-pytest>=2.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "appium-flutter-finder>=0.3.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
markers = [
    "smoke: critical smoke tests",
    "regression: full regression suite",
    "ios: iOS-only tests",
    "android: Android-only tests",
    "flutter: Flutter app tests",
    "shared: cross-platform tests",
]
